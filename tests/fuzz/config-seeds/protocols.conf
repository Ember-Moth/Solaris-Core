[General]
config-version = 1
mode = direct
[Proxy]
a = ss, x, 443, encrypt-method=aes-128-gcm, password=secret, udp-relay=true, udp-over-tcp=true, udp-over-tcp-version=2
b = vless, x, 443, uuid=00112233-4455-6677-8899-aabbccddeeff, tls=true, tls-server-name=x, flow=xtls-rprx-vision
c = anytls, x, 443, password=secret, idle-session-timeout-ms=1000
[Proxy Group]
Exit = select,a,b,c,DIRECT
[Rule]
DOMAIN-SUFFIX,example.com,Exit
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
FINAL,REJECT
