# Local explicit proxies only; the host never changes system proxy, routes or DNS.
mode: rule
listeners:
  - name: web
    type: http
    listen: 127.0.0.1
    port: 7890
  - name: socks
    type: socks
    listen: 127.0.0.1
    port: 7891
    udp: true
proxy-groups:
  - name: Route
    type: select
    proxies: [DIRECT, REJECT]
rules:
  - MATCH,Route
