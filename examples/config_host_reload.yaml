# Existing connections retain their plan; new connections use this rule set.
mode: rule
listeners:
  - name: web
    type: http
    listen: 127.0.0.1
    port: 7890
  - name: socks
    type: socks
    listen: 127.0.0.1
    port: 7891
    udp: true
proxy-groups:
  - name: Route
    type: select
    proxies: [DIRECT, REJECT]
rules:
  - DOMAIN-SUFFIX,blocked.example,REJECT
  - MATCH,DIRECT
