name: Solaris SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: ["ON", "OFF"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Verify SDK and lifecycle
        run: ctest --test-dir build --build-config Debug --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSOLARIS_SANITIZER=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --parallel
      - name: Verify lifecycle with sanitizer
        run: ctest --test-dir build --output-on-failure -R "sdk_smoke|lifecycle_contract"
